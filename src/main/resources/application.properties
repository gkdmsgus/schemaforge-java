spring.application.name=schemaforge-java
server.port=${PORT:8080}

# DB: Supabase PostgreSQL (prod) or H2 in-memory (local dev)
spring.datasource.url=${DB_URL:jdbc:h2:mem:schemaforge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Static files (built React)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
