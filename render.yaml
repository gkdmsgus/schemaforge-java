services:
  - type: web
    name: schemaforge-java
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: PORT
        value: 8080
